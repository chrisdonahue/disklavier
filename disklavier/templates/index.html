<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Control Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>MIDI Control Interface</h1>
    
    <div class="container">
        <div class="control-panel">
            <h2>MIDI Settings</h2>
            <div class="controls">
                <div>
                    <label for="port-select">MIDI Port:</label>
                    <select id="port-select">
                        <!-- Populated via JavaScript -->
                    </select>
                </div>
                <button id="connect-btn">Connect</button>
            </div>
            
            <div class="controls">
                <div>
                    <label for="channel">Channel:</label>
                    <select id="channel">
                        <!-- Populated via JavaScript -->
                    </select>
                </div>
                <div>
                    <label for="velocity">Velocity:</label>
                    <input type="range" id="velocity" min="1" max="127" value="64">
                    <span id="velocity-value">64</span>
                </div>
            </div>

            <h3>Piano</h3>
            <div class="piano" id="piano">
                <!-- Piano keys will be generated by JavaScript -->
            </div>
            
            <h3>Manual Control</h3>
            <div class="controls">
                <div>
                    <label for="note">Note:</label>
                    <input type="number" id="note" min="0" max="127" value="60">
                </div>
                <button id="note-on-btn">Note On</button>
                <button id="note-off-btn">Note Off</button>
            </div>
        </div>
        
        <div class="status" id="status">
            <p>Status messages will appear here...</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/midi.js') }}"></script>
</body>
</html>
